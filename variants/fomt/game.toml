note = "sub_080D3C34 (Cyphco src/sub_080D3C34.c): constructor/helper, 0x080D3C34-0x080D3C70 (0x3C bytes) — allocates via sub_080005E8(4) + sub_08004C5C, stores into *dest, calls virtual method vt[2] via sub_080D3960 if non-null. The 0x080D3C6C miss is an interior PC (+0x38), a resume/return inside the function the finder walk never reached. Covering the full function bounds as a resume_range."

# --- FPS FIXES ---
# The 0x080E0F48 / 0x080E0F94 cluster is the choppy FPS (see TRIAGE.md):
# hot helpers interpreted hundreds of times instead of running as
# recompiled code. The entry gets [[extra_func]]; the interior 0x080E0F90
# gets its own [[resume_range]] alongside it, following the RealClear64byte
# pattern already in game.toml (extra_func + resume_range for one function),
# because rooting the entry alone did not cover an interior PC there.

[[extra_func]]
addr = 0x080E0F48
mode = "thumb"
note = "sub_080E0F48 (Cyphco src/sub_080E0F48.c): integer-to-string (itoa-like) helper, 0x080E0F48-0x080E0F94 (0x4C bytes) — converts a u32 value to decimal ASCII in out, calls sub_080D0F26 (division helper, since ARM has no divide). THE FPS CAUSE: entry miss count 307 in the crash session — the hottest function in the log, interpreted instead of running as recompiled code. Finder never discovered it: no direct callers in the translated set, reached only via a path the static finder cannot follow. Entry, so [[extra_func]]; the interior 0x080E0F90 miss gets its own [[resume_range]] below (RealClear64byte pattern)."

[[resume_range]]
start = 0x080E0F48
end   = 0x080E0F94
mode  = "thumb"
note = "sub_080E0F48 (Cyphco src/sub_080E0F48.c), 0x080E0F48-0x080E0F94: interior coverage for the 0x080E0F90 miss (+0x48, count 273 — reached on ~89% of calls, so it is on the normal execution path, not a rare IRQ-resume). Added alongside the [[extra_func]] above, following the RealClear64byte pattern in this file (extra_func + resume_range for the same function), because rooting the entry alone did not cover an interior PC there."

[[resume_range]]
start = 0x080E0F94
