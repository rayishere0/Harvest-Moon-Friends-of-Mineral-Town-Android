# game.toml — Harvest Moon: Friends of Mineral Town (USA), native Android port.
#
# Consumed by gba_recompile: [program], [identity], and the [[...]] hint
# arrays below. The [game] / [rom] / [bios] / [save] / [recompiler]
# tables are read by the game shell / runtime, not by gba_recompile
# (see the notes inline). Hand-authored; no tool ever writes this file
# except the md5 stamp in tools/regen.sh step 2. Pipeline:
# docs/PROBE.md §9. Schema: gbarecomp docs/TOML_SCHEMA.md.

[game]
name           = "Harvest Moon: Friends of Mineral Town"
short_name     = "fomt"
default_region = "usa"

# ── Recompiler program table ─────────────────────────────────────────
#
# Cartridge maps at 0x08000000, 8 MiB (FoMT USA is 8,388,608 bytes;
# gba_recompile aborts if the file on disk is any other size).
# CORRECTION 2026-11-21: the probe assumed 16 MiB, but the first real
# translation run proved the ROM is 8 MiB (0x00800000) — gba_recompile
# accepted it and emitted 2 shards for 1,107 functions. The probe's
# "~2x WL4 generated-code scale" estimate was wrong with it; expect
# WL4-scale output, not double. (Size + md5 were fixed on main by Ray's
# "Fix" commit 0a00c824; this comment was the stale remainder.)
# entry_pc is the discovery seed: the header branch at 0x08000000.
# static_resume_all stays on: IRQ/SWI returns may resume at any
# instruction boundary, and strict-static coverage depends on it
# (gbarecomp docs/TOML_SCHEMA.md; docs/PROBE.md §4).
# aot_scan_start/end are deliberately OMITTED: a hand-bounded range
# risks decoding assets as code, and the decomp boundaries (once
# `make compare` passes) are the authoritative code/data split
# instead (Wario Land 4 precedent). codegen_shards is omitted too:
# the recompiler picks an adaptive count (WL4 got 16).
[program]
name              = "Harvest Moon: Friends of Mineral Town (USA)"
id                = "FOMT"
load_address      = 0x08000000
size              = 0x00800000
entry_pc          = 0x08000000
static_resume_all = true

[identity]
sha1 = "a2fc3574f0a65a4fcf7682fb274b9d7eebdef963"
md5  = "80355c831a7a25b0f70dc021ebd344f1"
# fomt.sha1 carries only the SHA-1, so the md5 cannot be derived from
# the decomp. It is a cross-check only: gba_recompile verifies the
# binary size + SHA-1, not the md5.

# ── ROM identity (runtime) ───────────────────────────────────────────
#
# rom = the user's own dump (never in this repo). The path is relative
# to this file: repo-root/third_party/fomt/baserom.gba, where
# tools/regen.sh step 3 copies it for the decomp build. No crc32 here:
# it is stamped into src/fomt_rom_identity.h by tools/regen.sh step 2
# (Wario Land 4 pattern); a crc32 of 0 means "no CRC check" downstream.
[rom]
path = "../../third_party/fomt/baserom.gba"
sha1 = "a2fc3574f0a65a4fcf7682fb274b9d7eebdef963"

# ── BIOS identity (runtime) ──────────────────────────────────────────
#
# The GBA BIOS is real, executed code. The runner refuses to launch
# without a hash-verified BIOS dump (gbarecomp: "BIOS is sacred").
# sha1 is the standard retail GBA BIOS hash.
[bios]
path = "../../bios/gba_bios.bin"
sha1 = "300c20df6731a33952ded8c436f7f186d25d3492"

# ── Recompiler entry & layout ────────────────────────────────────────
#
# DOCUMENTARY — gba_recompile does NOT consume this table (verified
# against tools/gba_recompile/config.cpp at pinned gbarecomp f23317f:
# there is no at_path("recompiler") anywhere in it). Strictness is
# enforced at runtime with GBARECOMP_STRICT_STATIC=1, not by `strict`
# here. These paths are the ones tools/regen.sh uses, and the future
# desktop/Android shell reads them too.
[recompiler]
entry_point = "0x08000000"
seeds       = "variants/fomt/symbols/imported_symbols.tsv"
boundaries  = "variants/fomt/symbols/function_boundaries.tsv"
out_dir     = "variants/fomt/generated"
strict      = true

# ── Save chip ────────────────────────────────────────────────────────
#
# FoMT uses 32 KiB SRAM: 2 slots x (0x3FEC + 0x28) fits 32 KiB exactly
# (docs/PROBE.md §5). The slot count (2 vs 3) is the open pin carried
# over from the earlier probe — if a third slot ever surfaces, this
# size changes with it.
[save]
type = "sram"
size = 32768

# ── Function table (dispatch hints) ──────────────────────────────────
#
# The first proven hint is below (strict-static abort log, 2026-11-21:
# pc=0x03000A1C, the .iwram wait routine). The finder plus (once
# `make compare` passes) the imported decomp symbols provide the
# seeds, and each further strict-static abort names the next missing
# PC for another [[extra_func]] / [[jump_table]] / [[data_range]].
# Do NOT invent addresses here — a wrong entry generates junk code,
# while a missing function is a loud, fixable dispatch miss
# (gbarecomp docs/TOML_SCHEMA.md, "false-positive policy").
#
# KNOWN RISKS — noted here only; decided by the first translation
# run's abort log, never by this file:
#
# 1. SRAM stack-copy routines. FoMT copies its SRAM read/write/verify
#    routines to the STACK (0x80/0xC0 bytes) and executes them there
#    (asm/code_lib_sram.s, func_080D379C/080D3800/080D3870). A stack
#    address cannot be pre-declared via [[code_copy]] — that mechanism
#    is for FIXED RAM addresses only. The likely fix is a small
#    per-game patch (replace the stack-copy call with a direct call to
#    the recompiled function, Wario Land 4 tweak style) or HLE at the
#    bus level. If the strict-static run aborts on a stack PC, that is
#    the signal. Do not guess a [[code_copy]] entry for it.
#
# 2. m4a SoundMainRam overlay. The MP2K mixer is copied to RAM and
#    executed there (the standard m4a pattern; the [[code_copy]] +
#    [[extra_func]] pair is the documented way to declare it). But its
#    runtime_start / source_start / size are FoMT-specific and are NOT
#    the Wario Land 4 values — they can only be written once the
#    translation run (or decomp symbols) proves the FoMT addresses.
#    Leave absent until observed.

[[code_copy]]
runtime_start = 0x03000490
source_start  = 0x0875B9F8
size          = 0x00000848
name          = "iwram_blob"
note          = "FoMT .iwram code blob (asm/code_iwram.s; fomt.lds .iwram): copied ROM->IWRAM at boot by crt0. Covers the IRQ dispatcher, IRQ handler, and the IntrWait-style wait routine. Source = ROM file offset 0x75B9F8; cross-check 0x0875B9F8 + 0x848 = 0x0875C240 (fomt.lds .pad anchor)."

[[extra_func]]
addr = 0x03000A1C
mode = "arm"
note = "func_03000A1C: IntrWait-style wait routine in the .iwram blob; first genuine strict-static miss after the BIOS fix. UPDATE 2026-11-22: the prologue scan does NOT seed the rest of the blob — it only fires on STMFD-push entries, so func_03000958 (IRQ handler, no push entry) missed anyway and gets its own [[extra_func]] below."

[[extra_func]]
addr = 0x03000958
mode = "arm"
note = "func_03000958 (asm/code_iwram.s:36-40): the game's IRQ handler in the .iwram blob, 0x03000958-0x03000A1C (0xC4 bytes); installed at the BIOS IRQ vector slot 0x03007FFC by func_080004C4 at boot, so it runs on every interrupt. The 0x03000958 miss is its ENTRY — the PR #3 auto-seed claim did not hold: collect_code_copy_seeds() (gbarecomp src/recompile/function_finder.cpp:717-800) only seeds ARM addresses whose first instruction is an STMFD push (or mov ip,sp + push), and this handler does not open with one. The [[code_copy]] already maps its bytes (source 0x0875BEC0), so the explicit entry seed is enough; no resume_range (entry, not interior)."

[[extra_func]]
addr = 0x080D19C0
mode = "thumb"
note = "RealClear64byte (src/m4a_1.s:551): m4a 64-byte clear helper (movs r1-r4,0; 4x stm r0!,{r1-r4}); the 0x080D19CC miss is its 2nd stm (+0xC), an interior IRQ-resume PC. Finder never discovered it - no direct callers in the decomp (only the extern decl in src/m4a.c:16); the m4a engine reaches it via a path the static finder cannot follow. UPDATE 2026-11-22: rooting the entry alone did NOT cover 0x080D19CC — the post-merge run still missed at the same PC, so the [[resume_range]] below carries the interior coverage explicitly."

[[resume_range]]
start = 0x080D19C0
end   = 0x080D19D6
mode  = "thumb"
note  = "RealClear64byte (src/m4a_1.s:551), 0x080D19C0-0x080D19D6 (11 thumb insns, 0x16 bytes): m4a 64-byte clear helper. The 0x080D19CC miss is its 2nd stm (+0xC), an interior IRQ-resume PC; rooting the entry (PR #4, merged) did not cover it, so declare the whole function as a resume range — every interior instruction is seeded as an explicit alias candidate and rolled into the host, independent of the static_resume_all loop. Also covers future IRQ landings at any other interior PC (0x080D19CA / 0x080D19CE / ...) without one resume=true entry per timing."

[[resume_range]]
start = 0x080D1204
end   = 0x080D1498
mode  = "thumb"
note  = "sub_080D1204, sub_080D12EC, and sub_080D139C (asm/code_809E804.s), 0x080D1204-0x080D1498: type-1, type-2, and type-3 decoder loops of the Unpack decompressor. Contains indirect calls `mov lr, pc; bx sb` at 0x080D127C, 0x080D1376, and 0x080D13AC, whose return addresses (0x080D1280, 0x080D137A, and 0x080D13B0) are missed by the static finder due to walk truncation at unconditional branches. Covering the entire decoder block in one contiguous resume_range handles all return PCs and interior IRQ landings."

[[extra_func]]
addr = 0x08009908
mode = "thumb"
note = "func_08009908 (asm/hardware.s:4183): linked-list iterator over the hardware.s list of vtable'd objects — walks the list from [r0,#0xC] to the r0+0x10 sentinel, invoking each node's method via _call_via_r1 (and a second via _call_via_r2 when the first returns nonzero); 0x08009908-0x08009940 (0x38 bytes). The 0x08009908 miss is its ENTRY. Finder never discovered it: no direct callers anywhere in the decomp (whole-tree grep; siblings func_08009940/9968/9984 do have direct callers) and no literal-pool or vtable reference to its address — it is reached only via an indirect call / stored function pointer the finder cannot follow. Entry, not interior, so no resume_range (static_resume_all covers interior PCs once rooted)."
[[extra_func]]
addr = 0x08008B0C
mode = "thumb"
note = "func_08008B0C (asm/hardware.s:2518): thin thumb wrapper around m4aSoundVSync (the m4a VBlank tick), 0x08008B0C-0x08008B18 (0xC bytes, returns 1); sibling wrappers in the same cluster are func_08008AF0 (func_08000568), func_08008AFC (m4aSoundInit + m4aSoundVSyncOff) and func_08008B18 (m4aSoundMain). The 0x08008B0C miss is its ENTRY. Finder never discovered it: no direct callers anywhere in the decomp (whole-tree grep for func_08008B0C / 08008B0C / 08008B0D finds only its own definition) and no literal-pool reference to its address — the vtable blobs it would live in (asm/vtables.s) are raw .incbin data the decomp never decodes, so the pointer is invisible to the finder; it is reached only via an indirect call / stored function pointer. The return-1 shape is consistent with being invoked as a list-node method by the func_08009908 iterator (PR #8), which continues while a method returns nonzero, though the exact caller cannot be pinned from the decomp. Entry, not interior, so no resume_range (the walk from the entry has no unconditional branch truncating it; static_resume_all covers interior PCs once rooted)."

[[extra_func]]
addr = 0x08008B18
mode = "thumb"
note = "func_08008B18 (asm/hardware.s:2526): thin thumb wrapper around m4aSoundMain (the m4a main tick), 0x08008B18-0x08008B24 (0xC bytes, returns 1); sibling wrapper to func_08008B0C (m4aSoundVSync, PR #9) in the same cluster — func_08008AF0 (func_08000568), func_08008AFC (m4aSoundInit + m4aSoundVSyncOff). The 0x08008B18 miss is its ENTRY. Finder never discovered it: no direct callers anywhere in the decomp (whole-tree grep for func_08008B18 / 08008B18 / 08008B19 finds only its own definition) and no literal-pool reference to its address — the vtable blobs it would live in (asm/vtables.s) are raw .incbin data the decomp never decodes, so the pointer is invisible to the finder; it is reached only via an indirect call / stored function pointer. The return-1 shape is consistent with being invoked as a list-node method by the func_08009908 iterator (PR #8), which continues while a method returns nonzero, though the exact caller cannot be pinned from the decomp. Entry, not interior, so no resume_range (the walk from the entry has no unconditional branch truncating it; static_resume_all covers interior PCs once rooted)."

[[extra_func]]
addr = 0x0805E760
mode = "thumb"
note = "func_0805E760 (asm/code_0803EE94.s:59553): indexed table-entry resolver in the event/script dispatcher file, 0x0805E760-0x0805E790 (0x30 bytes, 24 thumb insns): out->ptr = (entry[index].u16[1] << 2) + table[0x1C], out->id = entry[index].u16[0], zeros when index >= table[0x20] count; sibling func_0805E790 is the 16-byte-entry variant. The 0x0805E760 miss is its ENTRY. Finder never discovered it: exactly one caller in the whole decomp, func_0807865C (bl at code_0803EE94.s:113910), and that caller is itself undiscovered — its only caller is func_080DB1E4 (asm/code_linkonce.s:14385), which has no direct callers and no literal-pool reference anywhere in the tree (it news up a vtable'd object and invokes a method via _call_via_r2, so it is reached only via an indirect call / stored function pointer). The break is the undiscovered root, not a walk truncation: func_0807865C's walk from its entry has no unconditional branch before the bl at 113910. Entry, not interior, so no resume_range (static_resume_all covers interior PCs once rooted)."

[[extra_func]]
addr = 0x0800374C
mode = "thumb"
note = "func_0800374C (asm/intro_scene.s:5457): intro scene setup/update logic — calls func_08000D64, then _call_via_r2 on a sub-object. No direct callers anywhere in the decomp; reached via indirect call (mechanism unpinned). Note: the _call_via_r2 in func_0800371C goes through the [r4,#4]→[+4] member chain, NOT vtable_unk_080E5A18 (which this function installs into [r4]); whether 0x0800374D sits in a vtable is uncheckable — all vtables in asm/vtables.s are raw .incbin blobs."

[[jump_table]]
addr = 0x08139A88
stride = 4
count = 36
format = "abs32"
entries_mode = "auto"
note = "gMPlayJumpTableTemplate (fomt.lds): m4a music player sequence handlers. 36 abs32 function pointers copied to RAM by MPlayJumpTableCopy, so the static finder's jump-table heuristic never sees the table in ROM. Discovered from the strict-static miss log (0x080D19F6, 0x080D1A02, etc)."

[[extra_func]]
addr = 0x08000D64
mode = "thumb"
note = "func_08000D64 (asm/intro_scene.s:445): scene-state dispatcher (switches on [r5+0x6D28], calls func_08000E1C / func_08000FF8), 0x08000D64-0x08000E1C (0xB8 bytes). Its only caller in the whole decomp is a direct bl from func_0800374C (asm/intro_scene.s:5464) — missed because its sole caller is itself undiscovered, not via any _call_via_r2 or vtable."

[[extra_func]]
addr = 0x080093AC
mode = "thumb"
note = "func_080093AC (asm/hardware.s:3542): PPU mosaic/fade logic — writes BLDCNT 0x04000050 (fade to white/black), BLDALPHA 0x04000054, MOSAIC 0x0400004C; 0x080093AC-0x080094A4. It has THREE direct callers (code_linkonce.s:13932, :25129, hardware.s:3697); missed because the caller chain traces up to an undiscovered direct-caller root (sub_080DA76C ← sub_080D8178 ← func_08012028 ← nothing) — not a vtable."

[[extra_func]]
addr = 0x080094AC
mode = "thumb"
note = "func_080094AC (asm/hardware.s:3693): thin wrapper passing this+0xc (the fade/mosaic state struct) to func_080093AC; 0x080094AC-0x080094B8 (12 bytes). No direct callers anywhere in the decomp and no literal-pool reference; reached via indirect call (mechanism unpinned — no vtable named, and all vtables are raw .incbin blobs)."

[[extra_func]]
addr = 0x080094B8
mode = "thumb"
note = "func_080094B8 (asm/hardware.s:3701): constructor/initialiser — installs vtable_unk_080E5B80 (str r0, [r4, #8], hardware.s:3711-3712), initialises the fade struct at +0xc via func_08009324, calls func_080098AC. It has EIGHT direct callers (code_0803EE94.s x5, new_game.s x3) — it installs the vtable, it is not reached through it."

[[resume_range]]
start = 0x080095FC
end   = 0x08009638
mode  = "thumb"
note  = "func_080095FC (asm/hardware.s:3814): 0x080095FC-0x08009638 (0x3C bytes). Entry and interior misses (like 0x08009612 / 0x0800962A). Reached via indirect call."

[[extra_func]]
addr = 0x080096F0
mode = "thumb"
note = "func_080096F0 (asm/hardware.s): called by func_080D780C, which was itself undiscovered."

[[extra_func]]
addr = 0x08009864
mode = "thumb"
note = "func_08009864 (asm/hardware.s): called by func_080D781C, which was itself undiscovered."

[[resume_range]]
start = 0x08009968
end   = 0x08009984
mode  = "thumb"
note  = "func_08009968 (asm/hardware.s:4240): list remove, 0x08009968-0x08009984 (0x1C bytes). The 0x0800997E miss was an interior IRQ resume. Its only direct caller is func_080095FC (hardware.s:3830) — it is 095FC that is indirectly reached, not 09968."

[[extra_func]]
addr = 0x080D780C
mode = "thumb"
note = "func_080D780C (asm/code_linkonce.s:7739): 16-byte thunk — loads member +0xc, calls func_080096F0, returns 0; 0x080D780C-0x080D781C. No direct callers, no literal-pool reference; reached via indirect call (mechanism unpinned)."

[[extra_func]]
addr = 0x080D781C
mode = "thumb"
note = "func_080D781C (asm/code_linkonce.s:7749): 16-byte thunk — loads member +0xc, calls func_08009864, returns 0; 0x080D781C-0x080D782C. No direct callers, no literal-pool reference; reached via indirect call (mechanism unpinned)."

[[resume_range]]
start = 0x080D782C
end   = 0x080D7868
mode  = "thumb"
note  = "func_080D782C (asm/code_linkonce.s): 0x080D782C-0x080D7868 (0x3C bytes). Interior miss at 0x080D783C was bridged x416, an IRQ resume."

# Batch hints — FoMT name-screen crash (crash.log, run 3, 2026-11-28).
# Ray's play session crashed at the new-game name-entry screen (3 runs, same
# abort) and reported choppy/slow FPS. All 11 miss PCs from run 3 are covered
# here as 10 hints (0x0804F242 + 0x0804F24C share one range). None of the 11
# PCs is covered by the current variants/fomt/game.toml on main (verified
# 2026-11-28 against the 248-line file on main). Append to
# variants/fomt/game.toml. Do NOT claim FULLY_STATIC until the strict confirm
# passes after merge (GBARECOMP_STRICT_STATIC=1, expect FULLY_STATIC).

# --- THE CRASH FIX ---
# sub_08004C68 is the SELF-HEAL bridge that never returns (see TRIAGE.md).
# Rooting its entry removes the bridge entirely.

[[extra_func]]
addr = 0x08004C68
mode = "thumb"
note = "sub_08004C68 (Cyphco src/sub_08004C68.c): thin constructor wrapper, 0x08004C68-0x08004C7C (0x14 bytes) — installs vtable D_080E5AD4 into *p, calls sub_08000800, returns. THE NAME-SCREEN CRASH: the SELF-HEAL bridge for this entry never returned to stop_pc 0x08000848; it interpreted the whole game loop until the 200M-instruction cap, aborting in the BIOS IRQ-dispatcher region at 0x00000370 (VBlank IRQs self-deliver via runtime_tick into the recompiled BIOS while the bridge runs). Its caller sub_08000840 is translated (it executed the bl at 0x08000844), but the finder never discovered the callee — likely walk truncation in sub_08000840. Rooting the entry removes the bridge entirely. Entry, not interior, so no resume_range (static_resume_all covers interior PCs once rooted)."

# --- REMAINING INTERIOR MISSES (address order) ---

[[resume_range]]
start = 0x0800370C
end   = 0x08003730
mode  = "thumb"
note = "sub_0800370C (Cyphco src/sub_0800370C.c): constructor, 0x0800370C-0x08003730 (0x24 bytes) — installs vtable 0x080E5A64, calls sub_080005E8(0x6D34), stores sub_08000928() at [arg0+4]. The 0x0800371C miss is an interior PC (+0x10), a resume/return inside the function the finder walk never reached (walk stops at the first unconditional branch). Covering the full function bounds as a resume_range."

[[resume_range]]
start = 0x0804EF10
end   = 0x0804EF34
mode  = "thumb"
note = "sub_0804EF10 (Cyphco src/sub_0804EF10.c): thin wrapper forwarding struct fields to sub_0804EA08, 0x0804EF10-0x0804EF34 (0x24 bytes), returns 0. The 0x0804EF20 miss is an interior PC (+0x10), a resume/return inside the function the finder walk never reached. Covering the full function bounds as a resume_range."

[[resume_range]]
start = 0x0804F18C
end   = 0x0804F1B0
mode  = "thumb"
note = "sub_0804F18C (Cyphco src/sub_0804F18C.c): small predicate on bytes at +4/+8, 0x0804F18C-0x0804F1B0 (0x24 bytes), returns 0/1. The 0x0804F19C miss is an interior PC (+0x10), a resume/return inside the function the finder walk never reached. Covering the full function bounds as a resume_range."

[[resume_range]]
start = 0x0804F1B0
end   = 0x0804F29C
mode  = "thumb"
note = "sub_0804F1B0 (Cyphco src/sub_0804F1B0.c): sprite/object setup, 0x0804F1B0-0x0804F29C (0xEC bytes) — fills VRAM with a pattern, calls sub_08051334 twice, sub_080D3798 (CpuSet/DMA) for the palette, InitArchiveIndex(entry, 0x8728264), sub_0805E7A4; returns 0. The 0x0804F242 (+0x92) and 0x0804F24C (+0x9C) misses are interior PCs, resume/return points inside the function the finder walk never reached. One resume_range covering the full function bounds covers both."

[[resume_range]]
start = 0x080D3BC4
end   = 0x080D3C0C
mode  = "thumb"
note = "StringLength (Cyphco src/StringLength.c): strlen with a word-at-a-time fast path, 0x080D3BC4-0x080D3C0C (0x48 bytes). The 0x080D3BE8 miss is an interior PC (+0x24), a resume/return inside the function the finder walk never reached. Covering the full function bounds as a resume_range."

